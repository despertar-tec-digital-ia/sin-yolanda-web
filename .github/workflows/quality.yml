name: Public site quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: public-quality-${{ github.event_name == 'schedule' && 'agenda-schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agenda_plan:
    if: github.event_name == 'schedule'
    name: Agenda freshness check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: plan
        run: node scripts/plan-agenda-refresh.mjs
  quality:
    needs: agenda_plan
    if: always() && (github.event_name != 'schedule' || (needs.agenda_plan.result == 'success' && needs.agenda_plan.outputs.changed == 'true'))
    name: Public artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      # CI validates a non-indexable review artifact; it never authorizes publication.
      - run: node scripts/package-public.mjs .artifacts/public --audience review
      - name: Require a clean, traceable artifact
        run: node -e "const r=require('./.artifacts/release.json'); if(r.dirty || r.commit!==process.env.GITHUB_SHA) process.exit(1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-site-${{ github.sha }}
          path: |
            .artifacts/public/
            .artifacts/release.json
          if-no-files-found: error
          retention-days: 7
          # The parent is hidden; only these two generated, validated paths are uploaded.
          include-hidden-files: true
