server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = / { return 302 /reservar; }
    location = /reservar { try_files /reservar.html =404; }
    location = /reservar/ { return 302 /reservar; }
    location = /health { return 200 'ok'; }
    location = /404.html { internal; }
    location = /robots.txt { try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }
    location /_astro/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { return 404; }
    error_page 404 /404.html;
}
