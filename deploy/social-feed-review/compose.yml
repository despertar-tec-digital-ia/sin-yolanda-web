services:
  sy-instagram-review:
    image: ${SY_PREVIEW_NGINX_IMAGE:?Use the inspected nginx image digest}
    container_name: sy-instagram-review-20261103
    user: "101:101"
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    volumes:
      - ../../.artifacts/${SY_PREVIEW_ARTIFACT:?Set the reviewed artifact name}/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ddtia-net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 20s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=ddtia-net
      - traefik.http.routers.sy-instagram-review.rule=Host(`instagram-sy.187.77.220.209.sslip.io`)
      - traefik.http.routers.sy-instagram-review.entrypoints=websecure
      - traefik.http.routers.sy-instagram-review.tls.certresolver=letsencrypt
      - traefik.http.services.sy-instagram-review.loadbalancer.server.port=8080
      - traefik.http.routers.sy-instagram-review-http.rule=Host(`instagram-sy.187.77.220.209.sslip.io`)
      - traefik.http.routers.sy-instagram-review-http.entrypoints=web
      - traefik.http.routers.sy-instagram-review-http.middlewares=sy-instagram-review-https
      - traefik.http.middlewares.sy-instagram-review-https.redirectscheme.scheme=https
networks:
  ddtia-net:
    external: true
