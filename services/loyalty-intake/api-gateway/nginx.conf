worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    default_type application/json;
    access_log off;
    server_tokens off;
    map_hash_bucket_size 128;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $request_method $intake_method_route {
        default @method_not_allowed;
        POST @intake_origin;
    }
    map $http_origin $intake_origin_route {
        default @intake_forbidden;
        "https://sin-yolanda.com" @intake_type;
    }
    map $http_content_type $intake_type_route {
        default @intake_invalid;
        "application/json" @intake_path;
        "application/json; charset=utf-8" @intake_path;
    }
    map $request_uri $intake_path_route {
        default @missing;
        "/api/registrations" @intake_size;
    }
    map $http_content_length $intake_size_route {
        default @intake_too_large;
        "" @intake_proxy;
        "~^[0-9]{1,3}$" @intake_proxy;
        "~^(?:[1-7][0-9]{3}|80[0-9]{2}|81[0-8][0-9]|819[0-2])$" @intake_proxy;
    }
    map $status $intake_allow_header { default ""; 405 "POST"; }
    server {
        listen 8080 default_server;
        server_name sy-intake-api.despertartdigital.cloud;
        # The empty directory is deliberate; all routes run the access phase first.
        root /srv/empty;
        autoindex off;
        disable_symlinks on;
        auth_basic "Sin Yolanda server relay";
        auth_basic_user_file /run/secrets/intake_proxy_auth;
        client_max_body_size 0;
        client_body_buffer_size 8192;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 5s;
        reset_timedout_connection on;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; object-src 'none'" always;
        add_header Allow $intake_allow_header always;
        location = /api/registrations {
            try_files /__intake_file_never_packaged__ $intake_method_route;
        }
        location / {
            try_files /__intake_file_never_packaged__ @missing;
        }
        # No externally reachable rewrite/return may bypass authentication.
        location @intake_origin { try_files /__intake_file_never_packaged__ $intake_origin_route; }
        location @intake_type { try_files /__intake_file_never_packaged__ $intake_type_route; }
        location @intake_path { try_files /__intake_file_never_packaged__ $intake_path_route; }
        location @intake_size { try_files /__intake_file_never_packaged__ $intake_size_route; }
        location @intake_proxy {
            client_max_body_size 8192;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 12s;
            proxy_pass_request_headers off;
            proxy_set_header Host intake;
            proxy_set_header Connection "";
            proxy_set_header Content-Type application/json;
            proxy_set_header Origin "https://sin-yolanda.com";
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Robots-Tag;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_intercept_errors on;
            error_page 500 502 503 504 =503 @intake_unavailable;
            proxy_pass http://intake:8000;
        }
        location @method_not_allowed { return 405 '{"code":"invalid_fields"}'; }
        location @intake_forbidden { return 403 '{"code":"verification_failed"}'; }
        location @intake_invalid { return 400 '{"code":"invalid_fields"}'; }
        location @intake_too_large { return 413 '{"code":"invalid_fields"}'; }
        location @intake_unavailable { return 503 '{"code":"unavailable"}'; }
        location @missing { return 404 '{"code":"unavailable"}'; }
    }
}
