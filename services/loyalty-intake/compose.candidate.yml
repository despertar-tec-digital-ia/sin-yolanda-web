# Private candidate only. This does not publish UI, attach Traefik or activate the QR.
name: sinyolanda-loyalty-intake
services:
  intake:
    image: sinyolanda-loyalty-intake:${SY_INTAKE_IMAGE_TAG:?Explicit reviewed image tag required}
    build:
      context: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    environment:
      SY_INTAKE_MODE: production
      SY_INTAKE_DATABASE: /data/registrations.sqlite
      SY_INTAKE_ENCRYPTION_KEY: ${SY_INTAKE_ENCRYPTION_KEY:?Dedicated encryption key required}
      SY_INTAKE_TURNSTILE_SECRET: ${SY_INTAKE_TURNSTILE_SECRET:?Real Turnstile secret required}
      SY_INTAKE_ORIGINS: ${SY_INTAKE_ORIGINS:?Exact HTTPS origin required}
      SY_INTAKE_TURNSTILE_HOSTNAME: ${SY_INTAKE_TURNSTILE_HOSTNAME:?Exact widget hostname required}
    ports:
      - "127.0.0.1:8841:8000"
    volumes:
      - intake-data:/data
      - intake-backups:/backups
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

volumes:
  intake-data:
    external: true
    name: ${SY_INTAKE_DATA_VOLUME:?Dedicated existing data volume required}
  intake-backups:
    external: true
    name: ${SY_INTAKE_BACKUP_VOLUME:?Dedicated existing backup volume required}
