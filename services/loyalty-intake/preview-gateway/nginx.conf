worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    map_hash_bucket_size 128;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $request_method $preview_static_file {
        default /__preview_file_never_packaged__;
        GET $uri;
        HEAD $uri;
    }
    map $request_method $preview_index_file {
        default /__preview_file_never_packaged__;
        GET /index.html;
        HEAD /index.html;
    }
    map $request_method $intake_method_route {
        default @method_not_allowed;
        POST @intake_origin;
    }
    map $http_origin $intake_origin_route {
        default @intake_forbidden;
        "https://registro-sy-prueba.despertartdigital.cloud" @intake_type;
    }
    map $http_content_type $intake_type_route {
        default @intake_invalid;
        "application/json" @intake_path;
        "application/json; charset=utf-8" @intake_path;
    }
    # Compare the original URI: query strings, encoding and normalized aliases cannot pass.
    map $request_uri $intake_path_route {
        default @missing;
        "/api/registrations" @intake_size;
    }
    # Fixed-length requests are checked after authentication; absent length allows chunked.
    map $http_content_length $intake_size_route {
        default @intake_too_large;
        "" @intake_proxy;
        "~^[0-9]{1,3}$" @intake_proxy;
        "~^(?:[1-7][0-9]{3}|80[0-9]{2}|81[0-8][0-9]|819[0-2])$" @intake_proxy;
    }
    map $request_uri $preview_allowed_methods {
        default "GET, HEAD";
        "/api/registrations" "POST";
    }
    map $status $preview_allow_header {
        default "";
        405 $preview_allowed_methods;
    }

    server {
        listen 8080 default_server;
        server_name registro-sy-prueba.despertartdigital.cloud;
        root /srv/public;
        autoindex off;
        disable_symlinks on;

        # No location may disable this. No externally reachable rewrite/return skips auth.
        auth_basic "Sin Yolanda private review";
        auth_basic_user_file /run/secrets/preview_auth;

        # Delay size rejection until the authenticated API handler. Static/unknown routes
        # never read a body; streaming is bounded by both Nginx and the backend deadline.
        client_max_body_size 0;
        client_body_buffer_size 8192;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 5s;
        reset_timedout_connection on;

        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; object-src 'none'" always;
        add_header Allow $preview_allow_header always;

        location = / {
            try_files $preview_index_file @method_not_allowed;
        }
        location ~ ^/(?:index\.html|styles\.css|intake\.js|intake-config\.json|assets/media/brand-logo\.png|fonts/(?:bebas-neue-400|roboto-slab-400|roboto-slab-700)\.woff2)$ {
            try_files $preview_static_file @method_not_allowed;
        }
        location = /api/registrations {
            try_files /__preview_file_never_packaged__ $intake_method_route;
        }
        location / {
            try_files /__preview_file_never_packaged__ @missing;
        }

        # Named handlers can be reached only after the originating location's auth phase.
        location @intake_origin {
            try_files /__preview_file_never_packaged__ $intake_origin_route;
        }
        location @intake_type {
            try_files /__preview_file_never_packaged__ $intake_type_route;
        }
        location @intake_path {
            try_files /__preview_file_never_packaged__ $intake_path_route;
        }
        location @intake_size {
            try_files /__preview_file_never_packaged__ $intake_size_route;
        }
        location @intake_proxy {
            client_max_body_size 8192;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            # The backend's absolute 10s body deadline must precede this read timeout.
            proxy_read_timeout 12s;
            proxy_pass_request_headers off;
            proxy_set_header Host intake;
            proxy_set_header Connection "";
            proxy_set_header Content-Type application/json;
            proxy_set_header Origin "https://registro-sy-prueba.despertartdigital.cloud";
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Robots-Tag;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_intercept_errors on;
            error_page 500 502 503 504 =503 @intake_unavailable;
            proxy_pass http://intake:8000;
        }
        location @method_not_allowed {
            default_type application/json;
            return 405 '{"code":"invalid_fields"}';
        }
        location @intake_forbidden {
            default_type application/json;
            return 403 '{"code":"verification_failed"}';
        }
        location @intake_invalid {
            default_type application/json;
            return 400 '{"code":"invalid_fields"}';
        }
        location @intake_too_large {
            default_type application/json;
            return 413 '{"code":"invalid_fields"}';
        }
        location @intake_unavailable {
            default_type application/json;
            return 503 '{"code":"unavailable"}';
        }
        location @missing {
            default_type application/json;
            return 404 '{"code":"unavailable"}';
        }
    }
}
