[project]
name = "sin-yolanda-loyalty-intake"
version = "0.1.0"
description = "Capture-first loyalty intake for Sin Yolanda, separate from the public static bundle"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=45,<50",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
